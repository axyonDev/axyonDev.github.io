<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AXYON.DEV – Oyun ve günlük hayat uygulamaları. Google Play geliştirici sayfası.">
    <title>AXYON.DEV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* ── CSS VARIABLES ─────────────────────────────────── */
        :root {
            --c-bg: #04060f;
            --c-deep: #070c1a;
            --c-crystal: #5bc8f5;
            --c-crystal-glow: rgba(91, 200, 245, 0.35);
            --c-gold: #f0b429;
            --c-gold-glow: rgba(240, 180, 41, 0.35);
            --c-pink: #ff4d8d;
            --c-blue: #4d9fff;
            --c-yellow: #ffd84d;
            --c-white: #e8f0ff;
            --c-grid: rgba(91, 200, 245, 0.06);
            --c-border: rgba(91, 200, 245, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: var(--c-bg);
            color: var(--c-white);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        /* ── CANVAS ARKAPLAN ─────────────────────────────── */
        #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* ── GRID OVERLAY ────────────────────────────────── */
        .grid-overlay {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background-image:
                linear-gradient(var(--c-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--c-grid) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
        }

        /* ── SCAN LINE ───────────────────────────────────── */
        .scanline {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
        }

        /* ── MAIN LAYOUT ─────────────────────────────────── */
        .page {
            position: relative; z-index: 10; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 0 20px 60px;
        }

        /* ── LANG SWITCHER (top-right) ───────────────────── */
        .lang-bar {
            position: fixed; top: 18px; right: 22px; z-index: 100;
            display: flex; gap: 6px; align-items: center;
        }

        .lang-btn {
            font-family: 'Orbitron', monospace; font-size: 9px;
            font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
            padding: 5px 11px; border-radius: 20px; cursor: pointer; border: 1px solid;
            transition: all 0.2s ease; background: transparent;
        }

        .lang-btn[data-lang="tr"] {
            color: var(--c-crystal); border-color: rgba(91,200,245,0.4);
        }
        .lang-btn[data-lang="en"] {
            color: var(--c-gold); border-color: rgba(240,180,41,0.4);
        }
        .lang-btn[data-lang="ar"] {
            color: var(--c-pink); border-color: rgba(255,77,141,0.4);
        }

        .lang-btn.active {
            background: rgba(91,200,245,0.12);
            box-shadow: 0 0 12px rgba(91,200,245,0.25);
        }
        .lang-btn[data-lang="en"].active {
            background: rgba(240,180,41,0.12);
            box-shadow: 0 0 12px rgba(240,180,41,0.25);
        }
        .lang-btn[data-lang="ar"].active {
            background: rgba(255,77,141,0.12);
            box-shadow: 0 0 12px rgba(255,77,141,0.25);
        }

        .lang-btn:hover { transform: translateY(-1px); }

        /* ── HEADER / LOGO ───────────────────────────────── */
        .header {
            width: 100%; max-width: 860px;
            display: flex; flex-direction: column; align-items: center;
            padding-top: clamp(60px, 10vw, 100px);
            margin-bottom: clamp(14px, 3vw, 30px);
        }

        .logo-wrap {
            position: relative;
            display: inline-flex;
            align-items: flex-start;
            margin-bottom: 28px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: clamp(32px, 8vw, 80px);
            font-weight: 900;
            letter-spacing: 0.12em;
            line-height: 1;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, var(--c-crystal) 55%, #2a6ebd 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 18px var(--c-crystal-glow)) drop-shadow(0 0 40px rgba(91,200,245,0.2));
            animation: logo-pulse 3s ease-in-out infinite;
        }

        .logo span {
            color: transparent;
            background: linear-gradient(180deg, #fff 0%, var(--c-gold) 60%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 12px var(--c-gold-glow));
        }

        .logo-dev {
            font-family: 'Orbitron', monospace;
            font-size: clamp(9px, 1.8vw, 16px);
            font-weight: 700;
            letter-spacing: 0.18em;
            line-height: 1;
            margin-left: 3px;
            margin-top: 6px;
            background: linear-gradient(90deg, var(--c-pink), var(--c-gold), var(--c-crystal));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(255,77,141,0.5));
            animation: dev-shimmer 4s ease-in-out infinite;
        }

        @keyframes dev-shimmer {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; filter: drop-shadow(0 0 14px rgba(91,200,245,0.8)); }
        }

        @keyframes logo-pulse {
            0%, 100% { filter: drop-shadow(0 0 18px var(--c-crystal-glow)) drop-shadow(0 0 40px rgba(91,200,245,0.2)); }
            50% { filter: drop-shadow(0 0 28px rgba(91,200,245,0.7)) drop-shadow(0 0 60px rgba(91,200,245,0.3)); }
        }

        /* ── SLOGAN HERO BAND ────────────────────────────── */
        .slogan-band {
            position: relative;
            padding: 18px 40px;
            border-radius: 50px;
            border: 1px solid rgba(91,200,245,0.22);
            background: rgba(91,200,245,0.05);
            backdrop-filter: blur(12px);
            text-align: center;
            margin-bottom: clamp(30px, 6vw, 56px);
            overflow: hidden;
            animation: slogan-float 5s ease-in-out infinite;
            cursor: default;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .slogan-band::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 60%);
            border-radius: inherit;
        }

        .slogan-band:hover {
            border-color: rgba(91,200,245,0.45);
            box-shadow: 0 0 32px rgba(91,200,245,0.15);
        }

        .slogan-text {
            font-family: 'Orbitron', monospace;
            font-size: clamp(11px, 2.8vw, 17px);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--c-crystal), #fff, var(--c-gold), var(--c-pink), var(--c-crystal));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: slogan-shimmer 5s linear infinite;
            position: relative; z-index: 1;
        }

        /* Arabic RTL support */
        html[lang="ar"] .slogan-text { letter-spacing: 0.04em; font-family: 'Rajdhani', sans-serif; font-size: clamp(13px, 3vw, 19px); }
        html[lang="ar"] { direction: rtl; }
        html[lang="ar"] .lang-bar { right: auto; left: 22px; }
        html[lang="ar"] .header-nav { flex-direction: row-reverse; }

        @keyframes slogan-shimmer {
            0% { background-position: 300% 0; }
            100% { background-position: 0% 0; }
        }

        @keyframes slogan-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* ── DIVIDER ─────────────────────────────────────── */
        .divider {
            width: 100%; max-width: 860px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--c-border), transparent);
            margin: clamp(10px, 2vw, 20px) 0;
        }

        /* ── NAV BUTTONS (top header area) ──────────────── */
        .header-nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: clamp(16px, 3vw, 28px);
        }

        .nav-btn {
            font-family: 'Orbitron', monospace;
            font-size: clamp(9px, 1.8vw, 12px);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 9px 22px;
            border-radius: 30px;
            border: 1px solid rgba(91,200,245,0.3);
            background: rgba(91,200,245,0.06);
            color: var(--c-crystal);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .nav-btn:hover {
            border-color: var(--c-crystal);
            background: rgba(91,200,245,0.14);
            box-shadow: 0 0 18px rgba(91,200,245,0.25);
            transform: translateY(-2px);
        }

        .nav-btn-privacy {
            border-color: rgba(255,77,141,0.3);
            background: rgba(255,77,141,0.06);
            color: var(--c-pink);
        }

        .nav-btn-privacy:hover {
            border-color: var(--c-pink);
            background: rgba(255,77,141,0.14);
            box-shadow: 0 0 18px rgba(255,77,141,0.25);
        }

        /* ── CATEGORY (section) ──────────────────────────── */
        .category-container {
            width: 100%; max-width: 860px;
            margin-bottom: clamp(16px, 3vw, 28px);
            border: 1px solid rgba(91,200,245,0.15);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(6px);
            background: rgba(7,12,26,0.4);
        }

        .category-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: clamp(14px, 2.5vw, 20px) clamp(18px, 3vw, 28px);
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .category-header:hover { background: rgba(91,200,245,0.06); }

        .category-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(12px, 2.2vw, 16px);
            font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--c-crystal);
        }

        .toggle-icon {
            color: var(--c-crystal); font-size: 14px;
            transition: transform 0.3s ease;
        }

        .category-container.collapsed .toggle-icon { transform: rotate(-90deg); }

        .category-content {
            max-height: 2000px;
            transition: max-height 0.45s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .category-container.collapsed .category-content {
            max-height: 0; opacity: 0; overflow: hidden;
        }

        .category-content-inner {
            padding: 0 clamp(14px, 3vw, 24px) clamp(18px, 3vw, 28px);
        }

        /* ── CARDS ROW ───────────────────────────────────── */
        .cards-row {
            display: flex; flex-wrap: wrap; gap: clamp(14px, 2.5vw, 22px);
            justify-content: center;
        }

        /* ── GAME CARDS ──────────────────────────────────── */
        .game-card {
            position: relative;
            width: clamp(180px, 26vw, 240px);
            border-radius: 14px; overflow: hidden;
            text-decoration: none;
            display: flex; flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(10,15,28,0.7);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .game-card:hover { transform: translateY(-6px); }

        .card-art {
            width: 100%; height: clamp(90px, 16vw, 120px);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        .card-body {
            padding: 14px 16px 16px;
            display: flex; flex-direction: column; gap: 6px;
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-grow: 1;
        }

        .card-tag {
            font-family: 'Orbitron', monospace; font-size: 9px;
            letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--c-crystal); opacity: 0.7;
        }

        .card-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(12px, 2.2vw, 14px);
            font-weight: 900; letter-spacing: 0.06em; color: #fff;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 11px; font-weight: 400;
            color: rgba(220,230,255,0.45); line-height: 1.5;
        }

        .card-cta {
            display: inline-flex; align-items: center; gap: 5px;
            margin-top: auto; padding: 7px 14px; border-radius: 8px;
            font-family: 'Orbitron', monospace; font-size: 9px;
            font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            transition: all 0.25s ease; width: fit-content;
            color: var(--c-crystal);
        }

        .game-card:hover .card-cta {
            border-color: var(--c-crystal);
            background: rgba(91,200,245,0.12);
            box-shadow: 0 0 12px rgba(91,200,245,0.3);
        }

        .game-card:hover .cta-arrow { transform: translateX(4px); }
        .cta-arrow { display: inline-block; transition: transform 0.2s; }

        /* Crystal card art */
        .card-crystal .card-art { background: rgba(91,200,245,0.05); }
        .card-crystal .card-art::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 60%, rgba(91,200,245,0.25) 0%, transparent 70%);
        }
        .pixel-grid {
            display: grid; grid-template-columns: repeat(5,1fr);
            gap: 3px; padding: 12px; position: relative; z-index: 1;
        }
        .px-cell {
            width: clamp(16px,3.5vw,22px); height: clamp(16px,3.5vw,22px);
            border-radius: 3px; display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', monospace; font-size: 7px; font-weight: 700;
        }
        .px-c1 { background: rgba(91,200,245,0.7); color: #fff; }
        .px-c2 { background: rgba(91,200,245,0.45); color: rgba(255,255,255,0.8); }
        .px-c3 { background: rgba(91,200,245,0.1); }
        .px-c4 { background: rgba(240,180,41,0.6); color: #fff; }

        .px-j1 { background: rgba(200,120,255,0.7); color:#fff; }
        .px-j2 { background: rgba(180,80,255,0.45); color:rgba(255,255,255,0.8); }
        .px-j3 { background: rgba(140,60,200,0.12); }
        .px-j4 { background: rgba(255,180,80,0.55); color:#fff; }

        .card-jewelry .card-art { background: rgba(180,80,255,0.05); }
        .card-jewelry .card-art::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 60%, rgba(180,79,255,0.25) 0%, transparent 70%);
        }

        .px-t1 { background: rgba(240,80,80,0.75); color:#fff; }
        .px-t2 { background: rgba(80,200,120,0.65); }
        .px-t3 { background: rgba(100,100,150,0.15); }

        .card-tetris .card-art { background: rgba(255,80,80,0.05); }
        .card-tetris .card-art::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 60%, rgba(255,68,68,0.2) 0%, transparent 70%);
        }

        .px-p1 { background: rgba(0,238,255,0.65); color:#000; font-size:6px; }
        .px-p2 { background: rgba(255,0,238,0.55); color:#fff; font-size:6px; }
        .px-p3 { background: rgba(100,100,150,0.12); }
        .px-p4 { background: rgba(255,204,0,0.65); color:#000; font-size:6px; }

        .card-pegrix .card-art { background: rgba(0,238,255,0.04); }
        .card-pegrix .card-art::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 60%, rgba(0,238,255,0.18) 0%, transparent 70%);
        }

        /* ── TOOL CARDS ──────────────────────────────────── */
        .tool-card {
            position: relative;
            width: clamp(180px, 26vw, 240px);
            border-radius: 14px; overflow: hidden;
            text-decoration: none;
            display: flex; flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(10,15,28,0.7);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; backdrop-filter: blur(10px);
        }
        .tool-card:hover { transform: translateY(-6px); }

        .tool-art {
            width:100%; height: clamp(90px, 16vw, 120px);
            display:flex; align-items:center; justify-content:center;
            position:relative; overflow:hidden; gap:12px;
        }

        .art-vignette { background: rgba(120,100,220,0.05); }
        .art-vignette::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 50%, rgba(120,100,220,0.25) 0%, transparent 70%);
        }
        .mock-dropzone {
            width:50px; height:46px; border-radius:10px;
            border:2px dashed rgba(120,100,220,0.5);
            display:flex; align-items:center; justify-content:center;
            position:relative; z-index:1;
        }
        .mock-icon-img {
            width:24px; height:24px; border-radius:4px;
            background:linear-gradient(135deg, rgba(120,100,220,0.5), rgba(200,120,255,0.3));
        }
        .mock-slider {
            width:50px; height:6px; border-radius:3px;
            background:rgba(120,100,220,0.25);
            position:relative; z-index:1;
            border:1px solid rgba(120,100,220,0.3);
        }

        .art-imsakiye { background: rgba(240,180,41,0.04); }
        .art-imsakiye::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 60%, rgba(240,180,41,0.2) 0%, transparent 70%);
        }
        .mock-moon-svg {
            width:36px; height:36px; fill:rgba(240,180,41,0.7);
            position:relative; z-index:1;
        }
        .mock-time-grid {
            display:flex; flex-direction:column; gap:5px;
            position:relative; z-index:1;
        }
        .mock-time-box {
            width:36px; height:9px; border-radius:4px;
            background:rgba(240,180,41,0.15); border:1px solid rgba(240,180,41,0.2);
        }
        .mock-time-box.active { background:rgba(240,180,41,0.4); }

        .art-zikir { background: rgba(76,202,128,0.04); }
        .art-zikir::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 60%, rgba(76,202,128,0.2) 0%, transparent 70%);
        }
        .mock-ring {
            width:60px; height:60px; border-radius:50%;
            border:3px solid rgba(76,202,128,0.4);
            display:flex; align-items:center; justify-content:center;
            position:relative; z-index:1;
            box-shadow: 0 0 16px rgba(76,202,128,0.2);
        }
        .mock-ring-inner {
            font-family:'Orbitron',monospace; font-size:16px; font-weight:900;
            color:rgba(76,202,128,0.8);
        }

        .tool-card .card-tag { color: rgba(255,255,255,0.5); }

        .tool-vignette .card-cta, .tool-vignette .card-tag { color: rgba(180,120,255,0.9); }
        .tool-vignette:hover .card-cta {
            border-color: rgba(180,120,255,0.6);
            background: rgba(180,120,255,0.1);
            box-shadow: 0 0 12px rgba(180,120,255,0.3);
        }

        .tool-imsakiye .card-cta, .tool-imsakiye .card-tag { color: var(--c-gold); }
        .tool-imsakiye:hover .card-cta {
            border-color: rgba(240,180,41,0.5);
            background: rgba(240,180,41,0.1);
            box-shadow: 0 0 12px rgba(240,180,41,0.3);
        }

        .tool-zikir .card-cta, .tool-zikir .card-tag { color: rgba(76,202,128,0.9); }
        .tool-zikir:hover .card-cta {
            border-color: rgba(76,202,128,0.5);
            background: rgba(76,202,128,0.1);
            box-shadow: 0 0 12px rgba(76,202,128,0.3);
        }

        /* ── PROJ CARDS ──────────────────────────────────── */
        .proj-card {
            position: relative;
            width: clamp(200px, 26vw, 260px);
            border-radius: 14px; overflow: hidden;
            text-decoration: none;
            display: flex; flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(10,15,28,0.7);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; backdrop-filter: blur(10px);
        }
        .proj-card:hover { transform: translateY(-6px); }
        .proj-art {
            width:100%; height: clamp(100px, 18vw, 130px);
            display:flex; align-items:center; justify-content:center;
            font-size: clamp(40px, 8vw, 64px);
            position:relative; overflow:hidden;
        }
        .proj-art::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 60%, var(--pc-glow) 0%, transparent 70%);
        }
        .proj-body {
            padding:14px 18px 18px;
            display:flex; flex-direction:column; gap:7px;
            border-top:1px solid rgba(255,255,255,0.06);
            flex-grow:1;
        }
        .proj-tag {
            font-family:'Orbitron',monospace; font-size:9px;
            letter-spacing:0.2em; text-transform:uppercase;
            color:var(--pc); opacity:0.7;
        }
        .proj-title {
            font-family:'Orbitron',monospace;
            font-size: clamp(13px,2.5vw,16px);
            font-weight:900; letter-spacing:0.06em; color:#fff;
        }
        .proj-count {
            font-size:12px; font-weight:400;
            color:rgba(220,230,255,0.45);
        }
        .proj-cta {
            display:inline-flex; align-items:center; gap:6px;
            margin-top:auto; padding:8px 16px; border-radius:8px;
            font-family:'Orbitron',monospace; font-size:9px;
            font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
            border:1px solid; transition:all 0.25s ease;
            width:fit-content; color:var(--pc);
            border-color:rgba(255,255,255,0.12);
            background:rgba(255,255,255,0.04);
        }
        .proj-card:hover .proj-cta { border-color:var(--pc); background:var(--pc-bg); box-shadow:0 0 12px var(--pc-glow); }
        .proj-card:hover .cta-arrow { transform:translateX(4px); }

        .pc-kuromi   { --pc:#b44fff; --pc-glow:rgba(180,79,255,0.3);  --pc-bg:rgba(180,79,255,0.1);  }
        .pc-kitty    { --pc:#ff4d8d; --pc-glow:rgba(255,77,141,0.3);  --pc-bg:rgba(255,77,141,0.1);  }
        .pc-labubu   { --pc:#4cca80; --pc-glow:rgba(76,202,128,0.3);  --pc-bg:rgba(76,202,128,0.1);  }
        .pc-spider   { --pc:#ff4444; --pc-glow:rgba(255,68,68,0.3);   --pc-bg:rgba(255,68,68,0.1);   }
        .pc-mcqueen  { --pc:#f0b429; --pc-glow:rgba(240,180,41,0.3);  --pc-bg:rgba(240,180,41,0.1);  }
        .pc-stitch   { --pc:#4d9fff; --pc-glow:rgba(77,159,255,0.3);  --pc-bg:rgba(77,159,255,0.1);  }

        .pc-kuromi  .proj-art { background:rgba(180,79,255,0.06); }
        .pc-kitty   .proj-art { background:rgba(255,77,141,0.06); }
        .pc-labubu  .proj-art { background:rgba(76,202,128,0.06); }
        .pc-spider  .proj-art { background:rgba(255,68,68,0.06); }
        .pc-mcqueen .proj-art { background:rgba(240,180,41,0.06); }
        .pc-stitch  .proj-art { background:rgba(77,159,255,0.06); }

        /* ── GOOGLE PLAY CARD ────────────────────────────── */
        .play-card {
            display: flex; align-items: center; gap: 16px;
            padding: 18px 22px; border-radius: 14px;
            border: 1px solid rgba(76,202,128,0.25);
            background: rgba(76,202,128,0.05);
            text-decoration: none;
            transition: all 0.3s ease;
            width: 100%; max-width: 460px;
            backdrop-filter: blur(10px);
        }
        .play-card:hover {
            border-color: rgba(76,202,128,0.5);
            background: rgba(76,202,128,0.1);
            box-shadow: 0 0 24px rgba(76,202,128,0.2);
            transform: translateY(-3px);
        }
        .play-icon {
            font-size: 36px; flex-shrink: 0;
            filter: drop-shadow(0 0 10px rgba(76,202,128,0.5));
        }
        .play-info { flex: 1; }
        .play-label {
            font-family: 'Orbitron', monospace; font-size: 9px;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: rgba(76,202,128,0.7); margin-bottom: 4px;
        }
        .play-name {
            font-family: 'Orbitron', monospace; font-size: clamp(13px, 2.5vw, 16px);
            font-weight: 900; letter-spacing: 0.06em; color: #fff;
        }
        .play-status {
            font-size: 11px; color: rgba(76,202,128,0.7); margin-top: 3px;
        }
        .play-arrow {
            font-size: 22px; color: rgba(76,202,128,0.6);
            transition: transform 0.2s;
        }
        .play-card:hover .play-arrow { transform: translateX(4px); }

        /* ── FOOTER ──────────────────────────────────────── */
        .footer {
            width: 100%; max-width: 860px; text-align: center;
            padding: 32px 20px 10px;
            border-top: 1px solid rgba(91,200,245,0.1);
            margin-top: 20px;
        }
        .footer-logo {
            font-family: 'Orbitron', monospace; font-size: 13px;
            font-weight: 900; letter-spacing: 0.18em;
            color: transparent;
            background: linear-gradient(90deg, var(--c-crystal), var(--c-gold));
            -webkit-background-clip: text; background-clip: text;
            margin-bottom: 10px;
        }
        .footer-contact {
            font-size: 13px; font-weight: 600;
            color: rgba(220,230,255,0.55); margin-bottom: 6px;
        }
        .footer-contact a {
            color: var(--c-crystal); text-decoration: none;
            transition: color 0.2s;
        }
        .footer-contact a:hover { color: #fff; }
        .footer-links { display: flex; gap: 18px; justify-content: center; margin-top: 12px; }
        .footer-link {
            font-family: 'Orbitron', monospace; font-size: 9px;
            letter-spacing: 0.15em; text-transform: uppercase;
            color: rgba(91,200,245,0.5); text-decoration: none;
            transition: color 0.2s;
        }
        .footer-link:hover { color: var(--c-crystal); }
        .footer-copy {
            font-size: 11px; color: rgba(220,230,255,0.2);
            margin-top: 14px;
        }
    </style>
</head>

<body>

    <div class="page">

        <section class="category-container">

            </div>
            <div class="category-content">

                    <!-- Google Play uygulamaları -->
                    <div style="margin-bottom: 22px;">
                        <div style="font-family:'Orbitron',monospace; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(76,202,128,0.7); margin-bottom:14px;" data-i18n="sub_apps">◈ MOBİL UYGULAMALAR</div>
                        <div class="cards-row">
                            <a href="https://play.google.com/store/search?q=zikirmatik+axyon" target="_blank" rel="noopener" class="play-card">
                                <div class="play-icon">📿</div>
                                <div class="play-info">

        <!-- Footer -->
        <footer class="footer">

                <a href="privacy/zikirmatik-privacy-policy.html" class="footer-link" data-i18n="footer_privacy">Gizlilik Politikası</a>
                <a href="https://play.google.com/store/apps/developer?id=axyon" target="_blank" rel="noopener" class="footer-link">Google Play</a>
            </div>
            <div class="footer-copy">© 2026 AXYON.DEV</div>
        </footer>

    </div>

    <script>
        // ── I18N DATA ─────────────────────────────────────────────
        const i18n = {
            tr: {
                slogan: 'OYUNLAR · ARAÇLAR · UYGULAMALAR',
                btn_play: 'Google Play',
                btn_privacy: 'Gizlilik Politikası',
                sec_projects: '◈ PROJELERİMİZ ◈',
                sub_apps: '◈ MOBİL UYGULAMALAR',
                app_label: 'Android Uygulama',
                app_status: '🟢 Google Play\'de Test Aşamasında',
                footer_contact: 'İletişim: <a href="mailto:axyon.dev@gmail.com">axyon.dev@gmail.com</a>',
                footer_privacy: 'Gizlilik Politikası',
            },
            en: {
                slogan: 'GAMES · TOOLS · APPS',
                btn_play: 'Google Play',
                btn_privacy: 'Privacy Policy',
                sec_projects: '◈ OUR PROJECTS ◈',
                sub_apps: '◈ MOBILE APPS',
                app_label: 'Android App',
                app_status: '🟢 In Testing on Google Play',
                footer_contact: 'Contact: <a href="mailto:axyon.dev@gmail.com">axyon.dev@gmail.com</a>',
                footer_privacy: 'Privacy Policy',
            },
            ar: {
                slogan: 'ألعاب · أدوات · تطبيقات',
                btn_play: 'Google Play',
                btn_privacy: 'سياسة الخصوصية',
                sec_projects: '◈ مشاريعنا ◈',
                sub_apps: '◈ تطبيقات الجوال',
                app_label: 'تطبيق أندرويد',
                app_status: '🟢 قيد الاختبار على Google Play',
                footer_contact: 'التواصل: <a href="mailto:axyon.dev@gmail.com">axyon.dev@gmail.com</a>',
                footer_privacy: 'سياسة الخصوصية',
            }
        };

        let currentLang = 'tr';

        function setLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
            });
            const d = i18n[lang];
            document.getElementById('slogan').textContent = d.slogan;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (d[key] !== undefined) {
                    if (d[key].includes('<a ')) el.innerHTML = d[key];
                    else el.textContent = d[key];
                }
            });
            // cta arrows don't have arrows in textContent - re-add
            document.querySelectorAll('.card-cta, .proj-cta').forEach(el => {
                if (!el.querySelector('.cta-arrow')) {
                    el.innerHTML = el.textContent.replace('→','') + ' <span class="cta-arrow">→</span>';
                }
            });
        }

        // ── ACCORDION ─────────────────────────────────────────────
        document.querySelectorAll('.category-header').forEach(header => {
            header.addEventListener('click', () => {
                header.closest('.category-container').classList.toggle('collapsed');
            });
        });

        // ── BG CANVAS ─────────────────────────────────────────────
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        let mouse = { x: -999, y: -999 };
        let stars = [], shootingStars = [], dustMotes = [], fairies = [], trailDust = [];
        let t0 = null;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            for (let i = 0; i < 4; i++) spawnTrailDust(e.clientX, e.clientY);
        });
        window.addEventListener('touchmove', e => {
            const t = e.touches[0];
            mouse.x = t.clientX; mouse.y = t.clientY;
            for (let i = 0; i < 3; i++) spawnTrailDust(t.clientX, t.clientY);
        }, { passive: true });

        const dustColors = [[180,120,255],[91,200,245],[255,180,240],[240,200,80],[150,255,200],[255,255,255]];
        function randColor() { return dustColors[Math.floor(Math.random()*dustColors.length)]; }

        for (let i = 0; i < 200; i++) stars.push({ x:Math.random(), y:Math.random(), r:Math.random()*1.3+0.15, a:Math.random()*0.65+0.1, phase:Math.random()*Math.PI*2, speed:Math.random()*0.0008+0.0002 });
        for (let i = 0; i < 55; i++) dustMotes.push(makeDustMote(true));

        function makeDustMote(randomY) {
            const [r,g,b] = randColor();
            return { x:Math.random()*W, y:randomY?Math.random()*H:H+10, vx:(Math.random()-0.5)*0.4, vy:-(Math.random()*0.5+0.15), r:Math.random()*2.5+0.6, alpha:Math.random()*0.6+0.2, maxAlpha:Math.random()*0.6+0.2, phase:Math.random()*Math.PI*2, speed:Math.random()*0.003+0.001, cr:r, cg:g, cb:b, wobble:(Math.random()-0.5)*0.008, life:1, maxLife:200+Math.random()*400 };
        }

        function spawnTrailDust(x, y) {
            const [r,g,b] = randColor(); const angle = Math.random()*Math.PI*2; const speed = Math.random()*1.8+0.3;
            trailDust.push({ x:x+(Math.random()-0.5)*12, y:y+(Math.random()-0.5)*12, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-0.8, r:Math.random()*3+1, alpha:0.9, cr:r, cg:g, cb:b, decay:Math.random()*0.025+0.018, gravity:0.04 });
        }

        for (let i = 0; i < 6; i++) fairies.push(makeFairy());

        function makeFairy() {
            const [r,g,b] = randColor();
            return { x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-0.5)*0.6, vy:(Math.random()-0.5)*0.4, r:Math.random()*5+4, alpha:Math.random()*0.4+0.15, phase:Math.random()*Math.PI*2, speed:Math.random()*0.002+0.001, cr:r, cg:g, cb:b, trail:[] };
        }

        function spawnShooter() {
            shootingStars.push({ x:W*(0.3+Math.random()*0.7), y:Math.random()*H*0.35, vx:-2.8-Math.random()*2.2, vy:1.6+Math.random()*1.4, len:100+Math.random()*90, alpha:1, width:1.2+Math.random() });
            setTimeout(spawnShooter, 1600+Math.random()*3000);
        }
        spawnShooter();

        function drawAurora(t) {
            const aT = t*0.0003;
            [{y:H*0,h:H*0.45,cr:80,cg:40,cb:180,a:0.04},{y:H*0.05,h:H*0.3,cr:40,cg:120,cb:220,a:0.035},{y:H*0,h:H*0.2,cr:180,cg:60,cb:200,a:0.025}].forEach((b,i)=>{
                const wave=Math.sin(aT+i*1.4)*0.5+0.5;
                const grd=ctx.createLinearGradient(0,b.y,0,b.y+b.h);
                grd.addColorStop(0,`rgba(${b.cr},${b.cg},${b.cb},${b.a*wave})`);
                grd.addColorStop(0.5,`rgba(${b.cr},${b.cg},${b.cb},${b.a*wave*0.6})`);
                grd.addColorStop(1,`rgba(${b.cr},${b.cg},${b.cb},0)`);
                ctx.fillStyle=grd; ctx.fillRect(0,b.y,W,b.h);
            });
        }

        function drawSparkle(x,y,size,alpha,r,g,b) {
            ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y);
            for (let i=0;i<4;i++) {
                ctx.save(); ctx.rotate((Math.PI/4)*i);
                const grd=ctx.createLinearGradient(0,-size,0,size);
                grd.addColorStop(0,`rgba(${r},${g},${b},0)`); grd.addColorStop(0.5,`rgba(${r},${g},${b},${alpha})`); grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
                ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(0,0,size*0.12,size,0,0,Math.PI*2); ctx.fill(); ctx.restore();
            }
            const cg=ctx.createRadialGradient(0,0,0,0,0,size*0.5);
            cg.addColorStop(0,`rgba(255,255,255,${alpha})`); cg.addColorStop(1,`rgba(${r},${g},${b},0)`);
            ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,size*0.5,0,Math.PI*2); ctx.fill(); ctx.restore();
        }

        function draw(ts) {
            if (!t0) t0 = ts; const t = ts - t0;
            ctx.clearRect(0,0,W,H);
            drawAurora(t);
            stars.forEach(p => {
                const pulse=Math.sin(t*p.speed*1000+p.phase)*0.35+0.65;
                ctx.beginPath(); ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);
                ctx.fillStyle=`rgba(180,210,255,${p.a*pulse})`; ctx.fill();
            });
            for (let i=shootingStars.length-1;i>=0;i--) {
                const s=shootingStars[i];
                const grd=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*(s.len/3),s.y-s.vy*(s.len/3));
                grd.addColorStop(0,`rgba(200,230,255,${s.alpha})`); grd.addColorStop(0.3,`rgba(91,200,245,${s.alpha*0.7})`); grd.addColorStop(1,'rgba(91,200,245,0)');
                ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*(s.len/3),s.y-s.vy*(s.len/3));
                ctx.strokeStyle=grd; ctx.lineWidth=s.width; ctx.stroke();
                s.x+=s.vx; s.y+=s.vy; s.alpha-=0.013;
                if (s.alpha<=0||s.x<-150||s.y>H+100) shootingStars.splice(i,1);
            }
            fairies.forEach(f => {
                f.trail.push({x:f.x,y:f.y}); if (f.trail.length>18) f.trail.shift();
                f.trail.forEach((pt,i)=>{
                    const a=(i/f.trail.length)*f.alpha*0.4; const rr=f.r*(i/f.trail.length)*0.7;
                    ctx.beginPath(); ctx.arc(pt.x,pt.y,rr,0,Math.PI*2); ctx.fillStyle=`rgba(${f.cr},${f.cg},${f.cb},${a})`; ctx.fill();
                });
                const pulse=Math.sin(t*f.speed*1000+f.phase)*0.4+0.6;
                const grd=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*3.5);
                grd.addColorStop(0,`rgba(255,255,255,${f.alpha*pulse*0.9})`); grd.addColorStop(0.3,`rgba(${f.cr},${f.cg},${f.cb},${f.alpha*pulse*0.6})`); grd.addColorStop(1,`rgba(${f.cr},${f.cg},${f.cb},0)`);
                ctx.beginPath(); ctx.arc(f.x,f.y,f.r*3.5,0,Math.PI*2); ctx.fillStyle=grd; ctx.fill();
                f.x+=f.vx; f.y+=f.vy;
                if (f.x<-20) f.x=W+20; if (f.x>W+20) f.x=-20;
                if (f.y<-20) f.y=H+20; if (f.y>H+20) f.y=-20;
            });
            for (let i=dustMotes.length-1;i>=0;i--) {
                const d=dustMotes[i]; d.life++;
                const lr=d.life/d.maxLife; const fade=lr<0.15?lr/0.15:lr>0.8?1-(lr-0.8)/0.2:1;
                const pulse=Math.sin(t*d.speed*1000+d.phase)*0.3+0.7; const a=d.maxAlpha*fade*pulse;
                const grd=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*2.5);
                grd.addColorStop(0,`rgba(255,255,255,${a*0.8})`); grd.addColorStop(0.4,`rgba(${d.cr},${d.cg},${d.cb},${a*0.5})`); grd.addColorStop(1,`rgba(${d.cr},${d.cg},${d.cb},0)`);
                ctx.beginPath(); ctx.arc(d.x,d.y,d.r*2.5,0,Math.PI*2); ctx.fillStyle=grd; ctx.fill();
                d.x+=d.vx+Math.sin(t*0.0008+d.phase)*0.3; d.y+=d.vy;
                if (d.life>=d.maxLife||d.y<-20) dustMotes[i]=makeDustMote(false);
            }
            for (let i=trailDust.length-1;i>=0;i--) {
                const d=trailDust[i]; if (d.r<0.6){trailDust.splice(i,1);continue;}
                const grd=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*2);
                grd.addColorStop(0,`rgba(255,255,255,${d.alpha*0.9})`); grd.addColorStop(0.4,`rgba(${d.cr},${d.cg},${d.cb},${d.alpha*0.7})`); grd.addColorStop(1,`rgba(${d.cr},${d.cg},${d.cb},0)`);
                ctx.beginPath(); ctx.arc(d.x,d.y,d.r*2,0,Math.PI*2); ctx.fillStyle=grd; ctx.fill();
                d.x+=d.vx; d.y+=d.vy; d.vy+=d.gravity; d.vx*=0.97; d.vy*=0.97; d.alpha-=d.decay; d.r*=0.97;
            }
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    </script>
